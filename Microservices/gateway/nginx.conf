events {
    worker_connections 1024;
}

http {
    # Docker's built-in DNS. Nginx looks up "drf" and "fastapi" when a request
    # arrives, so the gateway keeps working after a container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # one log line per request, for every service, in one place
    log_format gateway '$remote_addr "$request" -> $status '
                       'time=$request_time upstream=$upstream_addr';
    access_log /dev/stdout gateway;
    error_log  /dev/stderr warn;

    server {
        listen 80;

        # passed on with every forwarded request
        # (Authorization, the JWT header, is passed on automatically)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # never wait forever for a service
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # /drf/<anything>  ->  http://drf:8000/<anything>
        location /drf/ {
            set $drf_service http://drf:8000;
            rewrite ^/drf/(.*)$ /$1 break;
            proxy_pass $drf_service;
        }

        # /fastapi/<anything>  ->  http://fastapi:8001/<anything>
        location /fastapi/ {
            set $fastapi_service http://fastapi:8001;
            rewrite ^/fastapi/(.*)$ /$1 break;
            proxy_pass $fastapi_service;
        }

        # any other path: the gateway answers by itself
        location / {
            default_type application/json;
            return 404 '{"detail": "Unknown service. Use /drf/... or /fastapi/..."}';
        }

        # service stopped or too slow: answer in JSON instead of nginx's HTML page
        error_page 502 503 504 = @service_down;
        location @service_down {
            default_type application/json;
            return 503 '{"detail": "Service is unavailable"}';
        }
    }
}
